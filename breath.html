<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Breathe - Moodnest</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body class="breathe__page">
    <div class="trust-banner">
      Moodnest is a self-care tool, not a substitute for professional mental
      health care. If you are in crisis,
      <a href="resources.html">help is available 24/7</a>.
    </div>
    <!-- Navigation Bar Section -->
    <nav class="navbar">
      <div class="navbar__container">
        <a href="index.html"><img src="logo.png" id="navbar__logo" /></a>
        <div class="navbar__toggle" id="mobile-menu">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </div>
        <ul class="navbar__menu">
          <li class="navbar__item">
            <a href="index.html" class="navbar__links">Home</a>
          </li>
          <li class="navbar__item">
            <a href="breath.html" class="navbar__links">Relax</a>
          </li>
          <li class="navbar__item">
            <a href="moodLog.html" class="navbar__links">Daily Mood Log</a>
          </li>
          <li class="navbar__item">
            <a href="resources.html" class="navbar__links">Resource Hub</a>
          </li>
        </ul>
      </div>
    </nav>
    <!-- Immersive Breathing Section (Variant B) -->
    <main class="breathe-container">
      <div
        class="mode-indicator"
        id="modeIndicator"
        title="Current breathing mode"
      >
        <span class="mode-dot"></span>
        <span id="modeLabel">Gentle Breathing &bull; 6s In / 6s Out</span>
      </div>

      <h1 class="breathe-text" id="breath__state">Press play to begin</h1>

      <div class="immersive-circle-wrapper" id="rectangle__container">
        <div class="immersive-circle" id="breathCircle">
          <div class="circle-inner-ring"></div>
        </div>
      </div>

      <div class="controls" role="toolbar" aria-label="Breathing session controls">
        <button
          type="button"
          class="icon-btn"
          id="ttsToggleButton"
          title="Toggle voice guidance"
          aria-label="Toggle voice guidance"
        >
          <i class="fa-solid fa-volume-xmark" id="ttsIcon"></i>
        </button>

        <button
          type="button"
          class="icon-btn primary"
          id="breath__button"
          title="Start breathing"
          aria-label="Start breathing"
        >
          <i class="fa-solid fa-play" id="playIcon"></i>
        </button>

        <button
          type="button"
          class="icon-btn"
          id="mode__button"
          title="Switch to Box Breathing (4-4-4-4)"
          aria-label="Switch breathing mode"
        >
          <i class="fa-solid fa-cube" id="modeIcon"></i>
        </button>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
